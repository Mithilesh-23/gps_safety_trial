<!DOCTYPE html>
<html>

<head>

    <title>Women Safety Route Finder</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .top-panel {
            padding: 15px;
            text-align: center;
            background: white;
        }

        #map {
            height: 600px;
            width: 100%;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #status {
            margin: 10px;
        }

    </style>

</head>


<body>


<div class="top-panel">

    <h2>Women Safety Route Finder</h2>

    <button id="locationButton">
        Enable My Location
    </button>

    <button id="routeButton">
        Find Shortest Route
    </button>

    <p id="status">
        Enable your location first.
    </p>

</div>


<div id="map"></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// --------------------------------
// MAP
// --------------------------------

const defaultLatitude = 20.9371;
const defaultLongitude = 77.7796;

const map = L.map("map").setView(
    [defaultLatitude, defaultLongitude],
    14
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


// --------------------------------
// VARIABLES
// --------------------------------

let currentMarker = null;

let destinationMarker = null;

let routeLine = null;

let currentLatitude = null;

let currentLongitude = null;

let destinationLatitude = null;

let destinationLongitude = null;

let watchId = null;


// --------------------------------
// ENABLE LOCATION
// --------------------------------

document
    .getElementById("locationButton")
    .addEventListener(
        "click",
        startLocation
    );


function startLocation() {

    if (!navigator.geolocation) {

        setStatus(
            "Geolocation is not supported."
        );

        return;
    }


    setStatus(
        "Requesting location permission..."
    );


    watchId = navigator.geolocation.watchPosition(
        handleLocation,
        handleLocationError,
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
}


// --------------------------------
// CURRENT LOCATION
// --------------------------------

function handleLocation(position) {

    currentLatitude =
        position.coords.latitude;

    currentLongitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    console.log(
        "Current location:",
        currentLatitude,
        currentLongitude
    );


    if (currentMarker === null) {

        currentMarker = L.marker([
            currentLatitude,
            currentLongitude
        ])
        .addTo(map)
        .bindPopup(
            "Your Current Location"
        );

        currentMarker.openPopup();

    } else {

        currentMarker.setLatLng([
            currentLatitude,
            currentLongitude
        ]);
    }


    map.setView([
        currentLatitude,
        currentLongitude
    ], 16);


    setStatus(
        "Location active. Click on the map to select destination."
        + " Accuracy: "
        + accuracy.toFixed(1)
        + " m"
    );
}


// --------------------------------
// DESTINATION
// --------------------------------

map.on(
    "click",
    function(event) {

        destinationLatitude =
            event.latlng.lat;

        destinationLongitude =
            event.latlng.lng;


        console.log(
            "Destination:",
            destinationLatitude,
            destinationLongitude
        );


        // Remove old destination marker
        if (destinationMarker !== null) {

            map.removeLayer(
                destinationMarker
            );
        }


        // Create new destination marker
        destinationMarker =
            L.marker([
                destinationLatitude,
                destinationLongitude
            ])
            .addTo(map)
            .bindPopup(
                "Destination"
            )
            .openPopup();


        setStatus(
            "Destination selected. Click Find Shortest Route."
        );
    }
);


// --------------------------------
// FIND ROUTE
// --------------------------------

document
    .getElementById("routeButton")
    .addEventListener(
        "click",
        findRoute
    );


function findRoute() {

    if (
        currentLatitude === null ||
        currentLongitude === null
    ) {

        setStatus(
            "Please enable your location first."
        );

        return;
    }


    if (
        destinationLatitude === null ||
        destinationLongitude === null
    ) {

        setStatus(
            "Please select a destination on the map."
        );

        return;
    }


    setStatus(
        "Finding shortest route..."
    );


    fetch(
        "/api/route",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                start_lat:
                    currentLatitude,

                start_lon:
                    currentLongitude,

                end_lat:
                    destinationLatitude,

                end_lon:
                    destinationLongitude

            })

        }
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        if (!data.success) {

            setStatus(
                data.message
            );

            return;
        }


        drawRoute(
            data.geometry
        );


        const distanceKm =
            data.distance / 1000;

        const durationMinutes =
            data.duration / 60;


        setStatus(
            "Route found. Distance: "
            + distanceKm.toFixed(2)
            + " km | Estimated time: "
            + durationMinutes.toFixed(1)
            + " minutes"
        );

    })

    .catch(error => {

        console.error(error);

        setStatus(
            "Unable to find route."
        );

    });
}


// --------------------------------
// DRAW ROUTE
// --------------------------------

function drawRoute(geometry) {

    if (routeLine !== null) {

        map.removeLayer(
            routeLine
        );
    }


    routeLine =
        L.geoJSON(
            geometry
        ).addTo(map);


    map.fitBounds(
        routeLine.getBounds()
    );
}


// --------------------------------
// GPS ERROR
// --------------------------------

function handleLocationError(error) {

    console.error(error);


    if (error.code === 1) {

        setStatus(
            "Location permission denied."
        );

    } else if (error.code === 2) {

        setStatus(
            "Location unavailable."
        );

    } else if (error.code === 3) {

        setStatus(
            "Location request timed out."
        );

    } else {

        setStatus(
            "Unable to get your location."
        );
    }
}


// --------------------------------
// STATUS
// --------------------------------

function setStatus(message) {

    document
        .getElementById("status")
        .textContent = message;
}


</script>

</body>

</html>
