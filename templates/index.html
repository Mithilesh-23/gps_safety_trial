<!DOCTYPE html>
<html>

<head>

    <title>Women Safety Route Finder</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .location-box {
            margin-bottom: 20px;
        }

        .location-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .location-row {
            display: flex;
            gap: 8px;
        }

        .location-row input {
            flex: 1;
            padding: 10px;
            font-size: 15px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            background: #333;
            color: white;
            border-radius: 4px;
        }

        button:hover {
            background: #555;
        }

        .search-results {
            margin-top: 5px;
        }

        .result {
            padding: 10px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }

        .result:hover {
            background: #f0f0f0;
        }

        #map {
            height: 550px;
            width: 100%;
            margin-top: 20px;
        }

        #status {
            text-align: center;
            margin: 15px 0;
        }

        .route-button {
            width: 100%;
            margin-top: 10px;
            font-size: 17px;
        }

    </style>

</head>


<body>


<div class="container">

    <h2>
        Women Safety Route Finder
    </h2>


    <!-- ================================= -->
    <!-- STARTING LOCATION -->
    <!-- ================================= -->

    <div class="location-box">

        <label>
            Starting Location
        </label>


        <div class="location-row">

            <input
                type="text"
                id="startInput"
                placeholder="Search starting location..."
            >

            <button id="startSearchButton">
                Search
            </button>

            <button id="currentLocationButton">
                Use My Location
            </button>

        </div>


        <div
            id="startResults"
            class="search-results">
        </div>

    </div>


    <!-- ================================= -->
    <!-- DESTINATION -->
    <!-- ================================= -->

    <div class="location-box">

        <label>
            Destination
        </label>


        <div class="location-row">

            <input
                type="text"
                id="destinationInput"
                placeholder="Search destination..."
            >

            <button id="destinationSearchButton">
                Search
            </button>

        </div>


        <div
            id="destinationResults"
            class="search-results">
        </div>

    </div>


    <!-- ================================= -->
    <!-- ROUTE BUTTON -->
    <!-- ================================= -->

    <button
        id="routeButton"
        class="route-button">

        Find Shortest Route

    </button>


    <p id="status">
        Select a starting location and destination.
    </p>


    <!-- ================================= -->
    <!-- MAP -->
    <!-- ================================= -->

    <div id="map"></div>

</div>


<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// ==========================================
// MAP
// ==========================================

const defaultLatitude = 20.9371;

const defaultLongitude = 77.7796;


const map = L.map("map").setView(
    [
        defaultLatitude,
        defaultLongitude
    ],
    14
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


// ==========================================
// VARIABLES
// ==========================================

// Starting location

let startLatitude = null;

let startLongitude = null;


// Destination

let destinationLatitude = null;

let destinationLongitude = null;


// Markers

let startMarker = null;

let destinationMarker = null;


// Route

let routeLine = null;


// GPS

let watchId = null;


// ==========================================
// STATUS
// ==========================================

function setStatus(message) {

    document
        .getElementById("status")
        .textContent = message;
}


// ==========================================
// USE CURRENT LOCATION
// ==========================================

document
    .getElementById("currentLocationButton")
    .addEventListener(
        "click",
        useCurrentLocation
    );


function useCurrentLocation() {

    if (!navigator.geolocation) {

        setStatus(
            "Geolocation is not supported."
        );

        return;
    }


    setStatus(
        "Getting your current location..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            function(position) {

                startLatitude =
                    position.coords.latitude;

                startLongitude =
                    position.coords.longitude;


                const accuracy =
                    position.coords.accuracy;


                setStartMarker(
                    startLatitude,
                    startLongitude
                );


                document
                    .getElementById("startInput")
                    .value =
                        "Current Location";


                setStatus(
                    "Current location detected. Accuracy: "
                    + accuracy.toFixed(1)
                    + " meters"
                );


                // Stop watching after
                // getting a reasonably
                // accurate location.

                if (accuracy <= 30) {

                    navigator.geolocation.clearWatch(
                        watchId
                    );

                }

            },

            function(error) {

                console.error(error);


                if (error.code === 1) {

                    setStatus(
                        "Location permission denied."
                    );

                }

                else if (error.code === 2) {

                    setStatus(
                        "Location unavailable."
                    );

                }

                else if (error.code === 3) {

                    setStatus(
                        "Location request timed out."
                    );

                }

                else {

                    setStatus(
                        "Unable to get current location."
                    );
                }

            },

            {
                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: 15000
            }
        );
}


// ==========================================
// START MARKER
// ==========================================

function setStartMarker(
    latitude,
    longitude
) {

    if (startMarker === null) {

        startMarker =
            L.marker([
                latitude,
                longitude
            ])
            .addTo(map)
            .bindPopup(
                "Starting Location"
            );

    }

    else {

        startMarker.setLatLng([
            latitude,
            longitude
        ]);
    }


    map.setView(
        [
            latitude,
            longitude
        ],
        16
    );
}


// ==========================================
// DESTINATION MARKER
// ==========================================

function setDestinationMarker(
    latitude,
    longitude,
    name
) {

    if (destinationMarker !== null) {

        map.removeLayer(
            destinationMarker
        );
    }


    destinationMarker =
        L.marker([
            latitude,
            longitude
        ])
        .addTo(map)
        .bindPopup(
            name || "Destination"
        )
        .openPopup();


    map.setView(
        [
            latitude,
            longitude
        ],
        15
    );
}


// ==========================================
// SEARCH STARTING LOCATION
// ==========================================

document
    .getElementById("startSearchButton")
    .addEventListener(
        "click",
        function() {

            searchLocation(
                "start"
            );

        }
    );


// ==========================================
// SEARCH DESTINATION
// ==========================================

document
    .getElementById("destinationSearchButton")
    .addEventListener(
        "click",
        function() {

            searchLocation(
                "destination"
            );

        }
    );


// ==========================================
// SEARCH LOCATION
// ==========================================

async function searchLocation(
    type
) {

    let inputId;

    let resultId;


    if (type === "start") {

        inputId = "startInput";

        resultId = "startResults";

    }

    else {

        inputId = "destinationInput";

        resultId =
            "destinationResults";
    }


    const query =
        document
            .getElementById(inputId)
            .value
            .trim();


    if (!query) {

        setStatus(
            "Please enter a location."
        );

        return;
    }


    setStatus(
        "Searching location..."
    );


    try {

        const response =
            await fetch(
                "/api/search-location?q="
                + encodeURIComponent(query)
            );


        const data =
            await response.json();


        if (!data.success) {

            setStatus(
                data.message
            );

            return;
        }


        displayResults(
            data.locations,
            type,
            resultId
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Unable to search location."
        );
    }
}


// ==========================================
// DISPLAY RESULTS
// ==========================================

function displayResults(
    locations,
    type,
    resultId
) {

    const container =
        document.getElementById(
            resultId
        );


    container.innerHTML = "";


    if (locations.length === 0) {

        container.innerHTML =
            "<p>No locations found.</p>";

        return;
    }


    locations.forEach(
        function(location) {

            const result =
                document.createElement(
                    "div"
                );


            result.className =
                "result";


            result.textContent =
                location.name;


            result.addEventListener(
                "click",
                function() {

                    selectLocation(
                        location,
                        type
                    );

                }
            );


            container.appendChild(
                result
            );
        }
    );
}


// ==========================================
// SELECT LOCATION
// ==========================================

function selectLocation(
    location,
    type
) {

    if (type === "start") {

        startLatitude =
            location.latitude;

        startLongitude =
            location.longitude;


        document
            .getElementById("startInput")
            .value =
                location.name;


        setStartMarker(
            startLatitude,
            startLongitude
        );


        document
            .getElementById("startResults")
            .innerHTML = "";


        setStatus(
            "Starting location selected."
        );
    }


    else {

        destinationLatitude =
            location.latitude;

        destinationLongitude =
            location.longitude;


        document
            .getElementById(
                "destinationInput"
            )
            .value =
                location.name;


        setDestinationMarker(
            destinationLatitude,
            destinationLongitude,
            location.name
        );


        document
            .getElementById(
                "destinationResults"
            )
            .innerHTML = "";


        setStatus(
            "Destination selected."
        );
    }
}


// ==========================================
// FIND ROUTE
// ==========================================

document
    .getElementById("routeButton")
    .addEventListener(
        "click",
        findRoute
    );


async function findRoute() {

    if (
        startLatitude === null ||
        startLongitude === null
    ) {

        setStatus(
            "Please select a starting location."
        );

        return;
    }


    if (
        destinationLatitude === null ||
        destinationLongitude === null
    ) {

        setStatus(
            "Please select a destination."
        );

        return;
    }


    setStatus(
        "Finding shortest route..."
    );


    try {

        const response =
            await fetch(
                "/api/route",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        start_lat:
                            startLatitude,

                        start_lon:
                            startLongitude,

                        end_lat:
                            destinationLatitude,

                        end_lon:
                            destinationLongitude

                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            setStatus(
                data.message
            );

            return;
        }


        drawRoute(
            data.geometry
        );


        const distanceKm =
            data.distance / 1000;


        const durationMinutes =
            data.duration / 60;


        setStatus(
            "Route found | "
            + distanceKm.toFixed(2)
            + " km | "
            + durationMinutes.toFixed(1)
            + " minutes"
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Unable to find route."
        );
    }
}


// ==========================================
// DRAW ROUTE
// ==========================================

function drawRoute(
    geometry
) {

    if (routeLine !== null) {

        map.removeLayer(
            routeLine
        );
    }


    routeLine =
        L.geoJSON(
            geometry
        ).addTo(map);


    map.fitBounds(
        routeLine.getBounds()
    );
}


</script>


</body>

</html>
